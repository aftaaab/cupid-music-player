name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Skip postinstall (it downloads yt-dlp, only needed for the desktop app)
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build web assets
        run: npx vite build

      - name: Verify songs are bundled
        run: |
          count=$(ls dist/*.mp3 2>/dev/null | wc -l)
          echo "MP3 files bundled into the app: $count"
          ls dist/*.mp3 2>/dev/null || true
          if [ "$count" -eq 0 ]; then
            echo "::error::No .mp3 files in the build! The audio/ folder in the repo has no music. Check on github.com that audio/ shows your .mp3 files — if not, the .gitignore still contains 'audio/*.mp3' or the files were never committed."
            exit 1
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cupid-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
